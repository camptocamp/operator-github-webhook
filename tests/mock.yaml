# Mock of the GitHub API used by the integration tests, see tests/mock_github_api.py.
# The ConfigMap github-mock, containing the mock script, is created by the test fixture.
---
apiVersion: v1
kind: Namespace
metadata:
  name: github-mock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mock
  namespace: github-mock
  labels:
    app: github-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-mock
  template:
    metadata:
      labels:
        app: github-mock
    spec:
      # The mock doesn't talk to the Kubernetes API
      automountServiceAccountToken: false
      containers:
        - name: mock
          # Same image as the operator, already imported in the test cluster
          image: ghcr.io/camptocamp/github-webhook-operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /mock/mock_github_api.py
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: mock-script
              mountPath: /mock
              readOnly: true
      volumes:
        - name: mock-script
          configMap:
            name: github-mock
---
apiVersion: v1
kind: Service
metadata:
  name: github-mock
  namespace: github-mock
  labels:
    app: github-mock
spec:
  selector:
    app: github-mock
  ports:
    - port: 8080
      targetPort: 8080
